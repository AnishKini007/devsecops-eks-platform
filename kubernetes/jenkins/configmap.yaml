apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc-config
  namespace: devops-tools
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: "Capstone DevSecOps Jenkins - Managed by Configuration as Code"
      numExecutors: 2
      scmCheckoutRetryCount: 3
      mode: NORMAL
      
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              name: "Admin"
              password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
      
      authorizationStrategy:
        globalMatrix:
          permissions:
            - "Overall/Administer:admin"
            - "Overall/Read:authenticated"
      
      clouds:
        - kubernetes:
            name: "kubernetes"
            serverUrl: "https://kubernetes.default.svc.cluster.local"
            namespace: "devops-tools"
            jenkinsUrl: "http://jenkins-service.devops-tools.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-service.devops-tools.svc.cluster.local:50000"
            containerCapStr: "10"
            maxRequestsPerHostStr: "32"
            templates:
              - name: "jenkins-agent"
                namespace: "devops-tools"
                label: "jenkins-agent"
                nodeUsageMode: "NORMAL"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:latest"
                    workingDir: "/home/jenkins/agent"
                    ttyEnabled: true
                    resourceRequestCpu: "500m"
                    resourceRequestMemory: "512Mi"
                    resourceLimitCpu: "1000m"
                    resourceLimitMemory: "1024Mi"
                  - name: "docker"
                    image: "docker:dind"
                    privileged: true
                    ttyEnabled: true
                    command: "dockerd"
                    args: "--host=unix:///var/run/docker.sock"
                  - name: "dotnet"
                    image: "mcr.microsoft.com/dotnet/sdk:8.0"
                    ttyEnabled: true
                    command: "cat"
                  - name: "trivy"
                    image: "aquasec/trivy:latest"
                    ttyEnabled: true
                    command: "cat"
                volumes:
                  - emptyDirVolume:
                      mountPath: "/var/run"
                      memory: false
                yaml: |
                  spec:
                    tolerations:
                      - key: "dedicated"
                        operator: "Equal"
                        value: "devops"
                        effect: "NoSchedule"
                    nodeSelector:
                      role: devops
    
    unclassified:
      location:
        url: "http://jenkins.example.com/"
        adminAddress: "admin@example.com"
      
      globalLibraries:
        libraries:
          - name: "shared-library"
            defaultVersion: "main"
            implicit: false
            allowVersionOverride: true
            includeInChangesets: true
    
    tool:
      git:
        installations:
          - name: "Default"
            home: "git"
      
      jdk:
        installations:
          - name: "JDK17"
            home: "/opt/java/openjdk"
    
    credentials:
      system:
        domainCredentials:
          - credentials:
              - usernamePassword:
                  scope: GLOBAL
                  id: "github-credentials"
                  description: "GitHub Credentials"
                  username: "${GITHUB_USERNAME}"
                  password: "${GITHUB_TOKEN}"
              - usernamePassword:
                  scope: GLOBAL
                  id: "dockerhub-credentials"
                  description: "Docker Hub Credentials"
                  username: "${DOCKERHUB_USERNAME}"
                  password: "${DOCKERHUB_TOKEN}"
              - string:
                  scope: GLOBAL
                  id: "sonarqube-token"
                  description: "SonarQube Token"
                  secret: "${SONARQUBE_TOKEN}"
