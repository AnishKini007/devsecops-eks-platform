apiVersion: v1
kind: Secret
metadata:
  name: capstone-app-secret
  namespace: application
type: Opaque
# Placeholders only - replace before applying (keep MONGODB_PASSWORD equal to
# mongodb-password in kubernetes/mongodb/secret.yaml), or create the secret with kubectl.
stringData:
  MONGODB_USERNAME: "appuser"
  MONGODB_PASSWORD: "CHANGE_ME_APP_DB_PASSWORD"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
